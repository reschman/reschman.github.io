name: Update weekly menu

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript python3-pip
          pip3 install pdfplumber

      - name: Fetch and parse menu PDF
        run: |
          set -euo pipefail
          mkdir -p data/menus

          # Calculate current ISO week number and year
          WEEK=$(date +%V)
          YEAR=$(date +%y)
          
          echo "Fetching menu for week $WEEK, year $YEAR"
          
          PDF_URL="https://www.stadt-zuerich.ch/content/dam/stzh/schulen/pfingstweid/download-dateien/MenuWo${WEEK}_${YEAR}.pdf"
          PDF_FILE="data/menus/menu-current.pdf"
          JSON_FILE="data/menus/menu.json"
          
          # Try to download the PDF
          if curl -fsSL -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$PDF_URL" -o "$PDF_FILE"; then
            echo "✓ Menu PDF downloaded successfully"
            ls -lh "$PDF_FILE"
            
            # Extract menu data with Python
            python3 << 'PYTHON'
import pdfplumber
import json
from datetime import datetime

PDF_FILE = "data/menus/menu-current.pdf"
JSON_FILE = "data/menus/menu.json"

# Days of week
days = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"]
menu_data = {day: [] for day in days}

try:
    with pdfplumber.open(PDF_FILE) as pdf:
        page = pdf.pages[0]
        tables = page.extract_tables()
        
        if tables:
            table = tables[0]
            print(f"Found table with {len(table)} rows")
            
            if len(table) > 0:
                headers = table[0]
                print(f"Headers: {headers}")
                
                for col_idx, header in enumerate(headers):
                    day_name = None
                    for day in days:
                        if day in str(header):
                            day_name = day
                            break
                    
                    if day_name:
                        items = []
                        for row_idx in range(1, len(table)):
                            cell = table[row_idx][col_idx] if col_idx < len(table[row_idx]) else ""
                            if cell:
                                text = str(cell).strip()
                                if text and text not in ["Rohkost", "Blattsalat", "Salatbuffet", ""]:
                                    items.append(text)
                        
                        menu_data[day_name] = items[:2]
                        print(f"{day_name}: {items[:2]}")
        
except Exception as e:
    print(f"Error parsing PDF: {e}")

output = {
    "week": int(datetime.now().strftime("%V")),
    "year": int(datetime.now().strftime("%y")),
    "menu": menu_data,
    "fetched_at": datetime.utcnow().isoformat() + "Z"
}

with open(JSON_FILE, 'w', encoding='utf-8') as f:
    json.dump(output, f, ensure_ascii=False, indent=2)

print(f"Menu data saved to {JSON_FILE}")
PYTHON
          else
            echo "✗ Failed to download menu for week $WEEK. It might not be available yet."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          
          # Add files to git index
          git add data/menus/
          
          # Check if there are any changes to commit
          if git diff --cached --quiet; then
            echo "No menu changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update weekly menu"
          git push
