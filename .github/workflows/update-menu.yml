name: Update weekly menu

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and store menu PDF
        run: |
          set -euo pipefail
          mkdir -p data/menus

          # Calculate current ISO week number and year
          WEEK=$(date +%V)
          YEAR=$(date +%y)
          
          echo "Fetching menu for week $WEEK, year $YEAR"
          
          PDF_URL="https://www.stadt-zuerich.ch/content/dam/stzh/schulen/pfingstweid/download-dateien/MenuWo${WEEK}_${YEAR}.pdf"
          PDF_FILE="data/menus/menu-current.pdf"
          
          # Try to download the PDF
          if curl -fsSL -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$PDF_URL" -o "$PDF_FILE"; then
            echo "✓ Menu PDF downloaded successfully"
            ls -lh "$PDF_FILE"
            
            # Store metadata about the menu
            cat > "data/menus/menu-metadata.json" <<EOF
          {
            "week": $WEEK,
            "year": $YEAR,
            "url": "$PDF_URL",
            "downloaded_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "pdf_file": "menu-current.pdf"
          }
          EOF
          else
            echo "✗ Failed to download menu for week $WEEK. It might not be available yet."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          
          # Add files to git index
          git add data/menus/
          
          # Check if there are any changes to commit
          if git diff --cached --quiet; then
            echo "No menu changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update weekly menu"
          git push
