name: Update discharge data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-discharge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch station page and update JSON
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            "https://www.hydrodaten.admin.ch/de/seen-und-fluesse/stationen-und-daten/2099" \
            -o /tmp/station_2099.html

          python3 - <<'PY'
          import datetime
          import json
          import os
          import re

          DATA_PATH = "data/discharge.json"
          SOURCE_PATH = "/tmp/station_2099.html"

          previous = {}
          if os.path.exists(DATA_PATH):
              try:
                  with open(DATA_PATH, "r", encoding="utf-8") as f:
                      previous = json.load(f)
              except Exception:
                  previous = {}

          with open(SOURCE_PATH, "r", encoding="utf-8") as f:
              text = f.read()

          discharge_value = None
          source_timestamp = None

          # Parse direct station HTML table row:
          # <div>Letzter Messwert</div><div class="opacity-75">02.11.2026 21:40</div> ... <td><div>23</div>
          html_row_regex = re.compile(
              r"<div>\s*Letzter\s+Messwert\s*</div>\s*"
              r"<div[^>]*>\s*(\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2})\s*</div>\s*"
              r"</td>\s*<td[^>]*>\s*<div>\s*(\d+(?:[\.,]\d+)?)\s*</div>",
              re.IGNORECASE | re.DOTALL,
          )
          html_match = html_row_regex.search(text)

          if html_match:
              source_timestamp = html_match.group(1)
              discharge_value = float(html_match.group(2).replace(",", "."))

          # Fallback for markdown/text mirrors if HTML structure changes.
          if discharge_value is None:
              text_match = re.search(
                  r"Letzter\s+Messwert[^\n]*\|\s*(\d+(?:[\.,]\d+)?)\s*\|",
                  text,
                  re.IGNORECASE,
              )
              ts_match = re.search(r"Letzter\s+Messwert\s*(\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2})", text, re.IGNORECASE)
              if text_match:
                  discharge_value = float(text_match.group(1).replace(",", "."))
              if ts_match:
                  source_timestamp = ts_match.group(1)

          if discharge_value is None:
              raise RuntimeError("Could not parse discharge value from station content")

          previous_value = previous.get("discharge_m3s")
          previous_timestamp = previous.get("source_timestamp")

          trend = "unknown"
          delta = None

          if isinstance(previous_value, (int, float)):
              delta = round(discharge_value - float(previous_value), 1)

              # Always calculate trend based on delta (not based on timestamp equality)
              if abs(delta) < 0.1:
                  trend = "steady"
              elif delta > 0:
                  trend = "rising"
              else:
                  trend = "falling"

          output = {
              "station_id": "2099",
              "station_name": "Limmat - Zurich, Unterhard",
              "discharge_m3s": round(discharge_value, 1),
              "source_timestamp": source_timestamp,
              "previous_discharge_m3s": previous_value if isinstance(previous_value, (int, float)) else None,
              "delta_m3s": delta,
              "trend": trend,
              "fetched_at_utc": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "source_url": "https://www.hydrodaten.admin.ch/de/seen-und-fluesse/stationen-und-daten/2099"
          }

          with open(DATA_PATH, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=True, indent=2)
              f.write("\n")

          print(json.dumps(output, ensure_ascii=True))
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/discharge.json; then
            echo "No data changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discharge.json
          git commit -m "chore: update discharge data"
          git push
